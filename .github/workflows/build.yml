name: build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the toolchains to downloads.eolymp.com
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  conda:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            micromamba: micromamba-linux-64 701f39c06f8e6a670a0e186c8479b9e5c0502a2f0cda6cef65d83bdd2875e8bd micromamba
          - name: linux-arm64
            os: ubuntu-22.04-arm
            micromamba: micromamba-linux-aarch64 3bb56786e21b9b24024f599fe9185b4a59dc3f9f59937a42311ee583adbbb23c micromamba
          - name: win32-x64
            os: windows-2022
            micromamba: micromamba-win-64.exe f8b4284bd4eb1134122eaf93b3ea6c7be567e596de5829e1a6f478e34e41974a micromamba.exe
            yq: yq_windows_amd64.exe f9b1962fc1cf4a1fca36b5d634aa1a2a541cb9a4aabb8536f43cb95fab9a904e yq.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install tools
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          install() {
            curl -fsSL -o "$bin/$3" "$1"
            echo "$2  $bin/$3" | sha256sum -c --quiet -
            chmod +x "$bin/$3"
          }
          read -r asset sha256 file <<< "${{ matrix.micromamba }}"
          install "https://github.com/mamba-org/micromamba-releases/releases/download/2.10.0-0/$asset" "$sha256" "$file"
          if [ -n "${{ matrix.yq }}" ]; then
            read -r asset sha256 file <<< "${{ matrix.yq }}"
            install "https://github.com/mikefarah/yq/releases/download/v4.47.2/$asset" "$sha256" "$file"
          fi
          echo "$bin" >> "$GITHUB_PATH"
      - run: ./conda/build.sh ${{ matrix.name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: out/
          if-no-files-found: error

  macos:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./macos/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.os }}
          path: out/
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: [conda, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISHER_ROLE }}
          aws-region: eu-central-1
      - name: Upload
        env:
          BUCKET: ${{ vars.DOWNLOADS_BUCKET }}
        run: |
          cd out
          aws s3 cp --recursive --only-show-errors source "$BUCKET/toolchains/source" --cache-control "public, max-age=31536000, immutable"
          echo '{}' > toolchains.json
          for description in *.json; do
            [ "$description" != toolchains.json ] || continue
            name="${description%.json}"
            sha256="$(jq -r .sha256 "$description")"
            [ "$(sha256sum "$name.tar.gz" | cut -d' ' -f1)" = "$sha256" ]
            file="$name-${sha256:0:12}.tar.gz"
            aws s3 cp --only-show-errors "$name.tar.gz" "$BUCKET/toolchains/$file" --cache-control "public, max-age=31536000, immutable"
            jq --arg name "$name" --arg url "https://downloads.eolymp.com/code/toolchains/$file" --slurpfile description "$description" \
              '.[$name] = ({url: $url} + $description[0])' toolchains.json > next.json
            mv next.json toolchains.json
          done
          cat toolchains.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolchains
          path: out/toolchains.json
